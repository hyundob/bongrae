name: Verify Bongrae

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bongrae-alumni/frontend/package-lock.json
      - name: Verify frontend
        run: node scripts/verify.mjs frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-verification
          include-hidden-files: true
          path: |
            .harness/verify-frontend.json
            bongrae-alumni/frontend/playwright-report/
            bongrae-alumni/frontend/test-results/
          retention-days: 7

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify backend against disposable PostgreSQL
        run: node scripts/verify.mjs backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-verification
          include-hidden-files: true
          path: |
            .harness/verify-backend.json
            bongrae-alumni/backend/build/reports/tests/
            bongrae-alumni/backend/build/test-results/
          retention-days: 7

  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify.mjs infra

  quality-gate:
    if: always()
    needs: [frontend, backend, infra]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require all checks to pass
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          INFRA_RESULT: ${{ needs.infra.result }}
        run: |
          test "$FRONTEND_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$INFRA_RESULT" = success
