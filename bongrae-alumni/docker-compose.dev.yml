name: bongrae-alumni-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: bongrae-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alumni_db}
      POSTGRES_USER: ${POSTGRES_USER:-alumni_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
      TZ: ${TZ:-Asia/Seoul}
      PGTZ: ${TZ:-Asia/Seoul}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - bongrae_dev_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: bongrae-dev-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bongrae_dev_network

  backend:
    image: gradle:8.13-jdk21-alpine
    container_name: bongrae-dev-backend
    restart: unless-stopped
    working_dir: /workspace
    command: sh ./dev-entrypoint.sh
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-alumni_db}
      POSTGRES_USER: ${POSTGRES_USER:-alumni_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      FILE_UPLOAD_PATH: /app/uploads
      JAVA_OPTS: -Xms512m -Xmx1024m
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "127.0.0.1:${DEV_BACKEND_PORT:-18080}:8080"
    volumes:
      - ./backend:/workspace
      - ./uploads:/app/uploads
      - gradle_dev_cache:/home/gradle/.gradle
      - backend_dev_build:/workspace/build
      - backend_dev_project_cache:/workspace/.gradle
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bongrae_dev_network

  frontend:
    image: node:22-alpine
    container_name: bongrae-dev-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- -H 0.0.0.0 -p 3000"
    environment:
      NODE_ENV: development
      BACKEND_URL: http://backend:8080
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./frontend:/app
      - frontend_dev_node_modules:/app/node_modules
      - frontend_dev_next:/app/.next
    depends_on:
      - backend
    networks:
      - bongrae_dev_network

  nginx:
    image: nginx:1.27-alpine
    container_name: bongrae-dev-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    environment:
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./uploads:/var/www/uploads:ro
    depends_on:
      - frontend
      - backend
    networks:
      - bongrae_dev_network

networks:
  bongrae_dev_network:
    driver: bridge

volumes:
  postgres_dev_data:
  gradle_dev_cache:
  backend_dev_build:
  backend_dev_project_cache:
  frontend_dev_node_modules:
  frontend_dev_next:
