spring:
  application:
    name: bongrae-alumni-backend
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  session:
    timeout: 12h
    jdbc:
      initialize-schema: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

app:
  bootstrap:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
  upload:
    path: ${FILE_UPLOAD_PATH:/app/uploads}
