spring:
  application:
    name: bongrae-alumni-backend

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:change_this_jwt_secret}
  upload:
    path: ${FILE_UPLOAD_PATH:/app/uploads}
