map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name bongrae.co.kr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://bongrae.co.kr$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bongrae.co.kr;

    ssl_certificate /etc/letsencrypt/live/bongrae.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bongrae.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/site-locations.conf;
}
